name: Gitleaks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify official Gitleaks CLI and scan complete history
        run: |
          archive=/tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts="--all" .
